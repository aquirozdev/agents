services:
  banking-gateway:
    build: .
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    ports:
      - '${BANKING_GATEWAY_PORT:-8080}:8080'
    environment:
      BANKING_ENVIRONMENT: ${BANKING_ENVIRONMENT:-development}
      BANKING_INSTITUTION_ID: ${BANKING_INSTITUTION_ID:-cooperative-demo}
      BANKING_INSTITUTION_NAME: ${BANKING_INSTITUTION_NAME:-Cooperativa Demo}
      BANKING_CONNECTOR: ${BANKING_CONNECTOR:-demo}
      BANKING_CONNECTOR_FACTORY: ${BANKING_CONNECTOR_FACTORY:-}
      BANKING_FINERACT_BASE_URL: ${BANKING_FINERACT_BASE_URL:-https://fineract:8443/fineract-provider/api/v1}
      BANKING_FINERACT_USERNAME: ${BANKING_FINERACT_USERNAME:-mifos}
      BANKING_FINERACT_PASSWORD: ${BANKING_FINERACT_PASSWORD:-password}
      BANKING_FINERACT_TENANT: ${BANKING_FINERACT_TENANT:-default}
      BANKING_FINERACT_VERIFY_TLS: ${BANKING_FINERACT_VERIFY_TLS:-false}
      BANKING_UPSTREAM_BASE_URL: ${BANKING_UPSTREAM_BASE_URL:-}
      BANKING_UPSTREAM_TOKEN: ${BANKING_UPSTREAM_TOKEN:-}
      BANKING_UPSTREAM_VERIFY_TLS: ${BANKING_UPSTREAM_VERIFY_TLS:-true}
      BANKING_UPSTREAM_TIMEOUT_SECONDS: ${BANKING_UPSTREAM_TIMEOUT_SECONDS:-15}
      BANKING_UPSTREAM_CONNECT_TIMEOUT_SECONDS: ${BANKING_UPSTREAM_CONNECT_TIMEOUT_SECONDS:-5}
      BANKING_AUTH_MODE: ${BANKING_AUTH_MODE:-static-demo}
      BANKING_GATEWAY_TOKEN: ${BANKING_GATEWAY_TOKEN:-local-demo-token}
      BANKING_DEMO_SUBJECT: ${BANKING_DEMO_SUBJECT:-customer-demo-001}
      BANKING_VERIFIED_SUBJECT_HEADER: ${BANKING_VERIFIED_SUBJECT_HEADER:-X-Verified-Subject}
      BANKING_VERIFIED_SESSION_STATE_HEADER: ${BANKING_VERIFIED_SESSION_STATE_HEADER:-X-Verified-Session-State}
      BANKING_REQUIRE_VERIFIED_SESSION_FOR_PRIVATE_DATA: ${BANKING_REQUIRE_VERIFIED_SESSION_FOR_PRIVATE_DATA:-true}
      BANKING_DIFY_IDENTITY_HEADER: ${BANKING_DIFY_IDENTITY_HEADER:-X-Dify-End-User-ID}
      BANKING_DIFY_IDENTITY_SIGNATURE_HEADER: ${BANKING_DIFY_IDENTITY_SIGNATURE_HEADER:-X-Dify-End-User-Signature}
      BANKING_DIFY_IDENTITY_SECRET: ${BANKING_DIFY_IDENTITY_SECRET:-local-dify-identity-secret}
      BANKING_WHATSAPP_ENABLED: ${BANKING_WHATSAPP_ENABLED:-false}
      BANKING_WHATSAPP_VERIFY_TOKEN: ${BANKING_WHATSAPP_VERIFY_TOKEN:-}
      BANKING_WHATSAPP_APP_SECRET: ${BANKING_WHATSAPP_APP_SECRET:-}
      BANKING_WHATSAPP_IDENTITY_SECRET: ${BANKING_WHATSAPP_IDENTITY_SECRET:-local-auth-identity-secret}
      BANKING_WHATSAPP_ACCESS_TOKEN: ${BANKING_WHATSAPP_ACCESS_TOKEN:-}
      BANKING_WHATSAPP_PHONE_NUMBER_ID: ${BANKING_WHATSAPP_PHONE_NUMBER_ID:-}
      BANKING_AUTH_STATE_DB: ${BANKING_AUTH_STATE_DB:-/data/auth.sqlite3}
      BANKING_AUTH_BASE_URL: ${BANKING_AUTH_BASE_URL:-http://localhost:8080}
      BANKING_AUTH_VERIFICATION_MODE: ${BANKING_AUTH_VERIFICATION_MODE:-local-acceptance}
      BANKING_AUTH_IDENTITY_SECRET: ${BANKING_AUTH_IDENTITY_SECRET:-local-auth-identity-secret}
      BANKING_AUTH_CUSTOMER_DIRECTORY: ${BANKING_AUTH_CUSTOMER_DIRECTORY:-}
      BANKING_DIFY_BASE_URL: ${BANKING_DIFY_BASE_URL:-http://api:5001}
      BANKING_DIFY_API_KEY: ${BANKING_DIFY_API_KEY:-}
    volumes:
      - whatsapp-state:/data
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/v1/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  whatsapp-state:
