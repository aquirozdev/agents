[project]
name = "dify-financial-institution-gateway"
version = "0.1.0"
description = "Core-agnostic banking gateway for Dify financial institution agents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "starlette>=0.41,<0.42",
    "httpx>=0.27,<1",
    "anyio>=4.4,<4.10",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "PyYAML>=6.0,<7",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<9"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/banking_gateway"]
