[project]
name = "dify-financial-institution-identity-proxy"
version = "0.1.0"
description = "OIDC identity-aware reverse proxy for the core-agnostic banking agent gateway"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "starlette>=0.41,<0.42",
    "anyio>=4.4,<4.10",
    "httpx>=0.27,<1",
    "pydantic-settings>=2.4,<3",
    "PyJWT[crypto]>=2.8,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/identity_proxy"]
